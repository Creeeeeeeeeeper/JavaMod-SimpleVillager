name: Bug 报告
description: 游戏崩溃、功能异常、错误行为等
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |-
        感谢提交 Bug 报告！请先阅读 [CONTRIBUTING.md](https://github.com/Creeeeeeeeeeper/JavaMod-SimpleVillager/blob/main/CONTRIBUTING.md) 并搜索已有 Issue，避免重复提交。
        请尽量只安装本 Mod + 对应加载器测试，排除其他模组冲突。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简洁清晰地描述遇到的问题
      placeholder: 例如：启动游戏时崩溃 / 放置某个方块后崩溃 / 功能表现异常...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现（如刚启动就崩溃请直接说明）
      placeholder: |
        1. 安装版本...
        2. 放置方块...
        3. 进行...操作
        4. 崩溃
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么
      placeholder: 例如：村民应该被正常取出/渲染消失
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么，可附截图或视频
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## 环境信息"
  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft 版本
      multiple: true
      options:
        - 1.21.1
        - 1.21.10
        - 1.21.11
        - 26.1
        - 26.2
        - 其他
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: 加载器及版本
      description: 例如 Fabric Loader 0.19.3
      placeholder: Fabric Loader x.xx.x
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: 本 Mod 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: textarea
    id: other_mods
    attributes:
      label: 其他已安装的 Mod
      description: 如有冲突嫌疑，请列出主要相关模组，或附上完整 mod 列表
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows / Linux / macOS
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java 版本
      placeholder: 例如 25
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## 日志与崩溃报告"
  - type: checkboxes
    id: logs
    attributes:
      label: 请附上以下信息（缺少可能无法排查）
      description: 日志较多时建议使用 GitHub Gist 或附上启动器（PCL / HMCL）导出的 zip 报告
      options:
        - label: 附上 `logs/latest.log`
          required: true
        - label: 附上 `config/simplevillager/` 下的 `client.toml` 和 `server.toml`
          required: false
        - label: 崩溃时附上崩溃报告或启动器导出的 zip
          required: false
        - label: 附上正在使用的本 Mod 的 jar 文件
          required: false
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 其他你认为有帮助的信息（截图、视频链接、相关讨论等）
    validations:
      required: false
