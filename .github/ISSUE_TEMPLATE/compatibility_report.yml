name: 兼容性问题
description: 与其他 Mod / 资源包 / 加载器冲突
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |-
        请先尝试**只安装本 Mod + 对应加载器**，确认问题是否确为兼容性冲突导致。
  - type: textarea
    id: description
    attributes:
      label: 冲突描述
      description: 冲突的表现是什么（崩溃 / 功能失效 / 渲染异常...）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现
    validations:
      required: true
  - type: input
    id: conflicting
    attributes:
      label: 冲突的 Mod / 资源包及版本
      description: 例如：Xaero's Minimap 26.4.2
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Minecraft 版本
      placeholder: 1.21.1 / 1.21.10 / 1.21.11 / 26.1 / 26.2
    validations:
      required: true
  - type: checkboxes
    id: logs
    attributes:
      label: 请附上信息
      options:
        - label: 附上 `logs/latest.log`
          required: true
        - label: 崩溃时附上崩溃报告或启动器导出的 zip
          required: false
  - type: textarea
    id: extra
    attributes:
      label: 附加信息
    validations:
      required: false
